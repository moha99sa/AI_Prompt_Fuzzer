name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Build extension
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Run streaming warning regression checks
        run: java -Djava.awt.headless=true -cp target/classes:target/test-classes StreamingResponseWarningTest

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release
          cp target/AI_Prompt_Fuzzer-1.0-SNAPSHOT.jar target/release/AI_Prompt_Fuzzer.jar
          cd target/release
          sha256sum AI_Prompt_Fuzzer.jar > AI_Prompt_Fuzzer.jar.sha256

      - name: Publish release with compiled extension
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" \
            target/release/AI_Prompt_Fuzzer.jar \
            target/release/AI_Prompt_Fuzzer.jar.sha256 \
            --verify-tag --title "AI Prompt Fuzzer $RELEASE_TAG" \
            --generate-notes "${options[@]}"
